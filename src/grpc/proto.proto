syntax = "proto3";
option go_package = "Mandatory4/grpc/proto";

// run the proto file with : 
// protoc --go_out=. --go_opt=paths=source_relative --go-grpc_out=. --go-grpc_opt=paths=source_relative proto.proto

message TimeStamp {
    int64 ts = 1;
}

message Empty {}

service Node { 
    rpc request (TimeStamp) returns (Empty){};
    rpc reply(Empty) returns (Empty){};
}